<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E2E30" />
      <stop offset="100%" stop-color="#1F1F21" />
    </linearGradient>
    <linearGradient id="orangeGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#F08A24" />
      <stop offset="100%" stop-color="#E66812" />
    </linearGradient>
    <filter id="shadow512" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fundo Grafite arredondado -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />

  <!-- Moldura externa suave -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#3E3E42" stroke-width="4" opacity="0.6" />

  <!-- Ícone central estilizado da Corteplan -->
  <g transform="translate(42, 42)" filter="url(#shadow512)">
    <!-- Parênteses / moldura angular esquerda característica do logo Corteplan -->
    <path d="M 120 86 L 76 86 C 60 86 50 96 50 112 L 50 316 C 50 332 60 342 76 342 L 120 342" 
          fill="none" stroke="url(#orangeGrad512)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Parênteses / moldura angular direita -->
    <path d="M 308 86 L 352 86 C 368 86 378 96 378 112 L 378 316 C 378 332 368 342 352 342 L 308 342" 
          fill="none" stroke="url(#orangeGrad512)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Letra "C" robusta da Corteplan -->
    <path d="M 272 140 
             C 256 124 232 114 204 114 
             C 152 114 118 156 118 214 
             C 118 272 152 314 204 314 
             C 232 314 256 304 272 288 
             L 272 250 
             C 258 264 240 272 218 272 
             C 182 272 160 242 160 214 
             C 160 186 182 156 218 156 
             C 240 156 258 164 272 178 
             Z" 
          fill="#FFFFFF" />

    <!-- Detalhe em corte geométrico laranja vibrante -->
    <rect x="204" y="198" width="76" height="32" rx="10" fill="url(#orangeGrad512)" />
  </g>
</svg>